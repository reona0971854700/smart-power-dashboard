<!DOCTYPE html>

<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <title>智慧電力調度系統</title>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>



    <style>

        body {background-color: #1a1a1a; color:white; font-family: sans-serif; padding:20px; }

        .card {background: #333131; padding: 20px; border-radius: 10px; flex: 1; min-width: 300px; }

        h1 { color: #00ff99; }

        .status { font-size: 100px; font-weight: bold; margin: 10px 0; }

        #chart {width: 100%; height: 400px; }

        .navbar {

            background-color: #000000;          /*背景*/

            border-bottom: 2px solid #00ff99;   /*底部邊框線*/

            position: fixed;                      /* 固定在最上方，捲動時不會消失 */

            width: 100%;

            top: 0;

            left: 0;

            z-index: 1000;                        /* 確保導覽列在最上層 */

            align-items: center;                  /*垂直居中*/

        }

        /* 2. 導覽列內部限制器：負責內容置中 */

        .nav-container {

            max-width: 1200px;                       /* 設定導覽列內容的最大寬度 */

            margin: 0 auto;                          /* 「水平置中」的神奇咒語 */

            padding: 10px 20px;

            display: flex;

            justify-content: space-between;          /* Logo 在左，連結在右 */

            align-items: center;

        }

        .logo {

            color: #00ff99;

            font-weight: 1.5rem;

            font-weight: bold;

        }

        .nav-links {

            list-style-type: none;

            display: flex;

            gap: 100px;

        }

        .nav-links a {

            color: white;

            text-decoration: none;

            font-size: 1rem;

            transition: 0.5;            /*動畫過渡時間*/

        }

        /*滑鼠對導覽列的互動效果*/

        .nav-links a:hover {

            color: #00ff99;

        }

        body {

            padding: 35px;

            background: #1a1a1a;

            color: white;

            font-family: sans-serif;

        }

        .page {

            display: none;

        }

        .active {

            display: block;

        }

        .container {

            max-width: 1200px;

            margin: 0 auto;

            padding: 20px;

        }

        .dashboard {

            display: flex;

            gap: 20px;

            flex-wrap: wrap;

            align-items: flex-start;

        }

        .card {

            background-color: #333131;

            padding: 20px;

            border-radius: 10px;

            flex: 1;

            min-width: 300px;

        }

        .history-layout {

            display: flex;

            gap: 20px;

            align-items: flex-start;

        }

        .search-panel {

            flex: 1;

            max-width: 250px;

        }

        .chart-panel {

            flex: 1;

        }

        .date-input {

            width: 90%;

            padding: 15px;

            background: #1a1a1a;

            border: 1px solid #00ff99;

            color: white;

            border-radius: 10px;

            margin-bottom: 15px;

        }

        .search-btn {

            width: 100%;

            padding: 10px;

            background: #00ff99;

            color: black;

            border: none;

            font-weight: bold;

            border-radius: 5px;

            cursor: pointer;

        }

        .search-btn:hover { background: #00cc7a; }

        /*隱藏預設圖示*/

        input[type="date"]::-webkit-calendar-picker-indicator {

            /*讓預設圖示*/

            opacity: 0;    

            /*讓圖片佔據原本的位置，點擊時依然能觸發日曆功能*/

            cursor: pointer;

            z-index: 1;

        }

        /*新增輸入欄自訂義圖示*/

        .date-input {

            position: relative;

            background-image: url('images/Date.png');

            background-repeat: no-repeat;

            background-position: calc(100% - 10px) center;

            background-size: 40px 40px;

        }

</style>

</head>

<body>

    <nav class="navbar">

        <div class="nav-container">

            <div class="logo">⚡ SmartPower-Dashboard</div>

            <ul class="nav-links">

                <li><a href="#" onclick="showPage('page-dashboard')">儀錶板</a></li>

                <li><a href="#" onclick="showPage('page-history')">歷史數據</a></li>

                <li><a href="#" onclick="showPage('page-mangement')">設備管理</a></li>

                <li><a href="#">系統設定</a></li>

            </ul>

        </div>

    </nav>



    <main class="container">

        <div id="page-dashboard" class="page active">

            <h1>⚡ 智慧建築能源管理系統</h1>

           

            <div class="dashboard">

                <div class="card">

                    <h3>目前即時總負載</h3>

                    <div id="load-value" class="status" style="color: #00ff99;">0 %</div>

                    <p>狀態 : 系統穩定進行中</p>

                </div>



                <div class="card">

                    <h3>各項設備即時功耗</h3>

                    <div id="chart"></div>

                </div>

            </div>

        </div>



        <div id="page-history" class="page">

            <h1>📊 用電歷史數據</h1>

            <div class="history-layout">

                <div class="search-panel card">

                    <h3>選擇查詢日期</h3>

                    <input type="date" id="history-date-picker" class="date-input">

           

                    <button onclick="queryHistory()" class="search-btn">查詢數據</button>

           

                    <hr style="border: 0.5px solid #444; margin: 20px 0;">

                    <p style="font-size: 0.9rem; color: #aaa;">* 可查詢一年內所有的已登記設備之用電總量</p>

                </div>



                <div class="chart-panel card">

                    <h3 id="history-title">請選擇日期後查詢</h3>

                    <div id="history-chart" style="width: 100%; height: 500px;"></div>

                </div>

            </div>

        </div>



        <div id="page-mangement" class="page">

            <h1>🛠️ 設備管理中心</h1>

            <div class="card">

                <p>設備列表功能開發中...</p>

            </div>

        </div>

    </main>

   



    <script>

        const chartDom=document.getElementById('chart');

        const myChart=echarts.init(chartDom,'dark');

        const historyChart = echarts.init(document.getElementById('history-chart'), 'dark');

        const historyDom = document.getElementById('history-chart');

        function showPage(pageId){

            document.querySelectorAll('.page').forEach(page => {page.classList.remove('active'); });

            document.getElementById(pageId).classList.add('active');

            if (pageId === 'page-dashboard') {

                myChart.resize();

            } else if (pageId === 'page-history') {

                historyChart.resize();

            }

        }

        function updateData(){

            const acPower = Math.floor(Math.random() * 40) + 10;     // 冷氣

            const fridgePower = 15;                                  // 冰箱：固定 15%

            const lightPower = Math.floor(Math.random() * 10) + 2;   // 燈光

            const evPower = Math.floor(Math.random() * 30);          // 電動車充電

            const currentLoad = acPower + fridgePower + lightPower + evPower;

            document.getElementById('load-value').innerText=`${currentLoad}%`;



            document.getElementById('load-value').style.color = currentLoad > 80 ? '#ff4d4d' : '#00ff99';



            const option={

                backgroundColor: 'transparent',

                xAxis: {type: 'category', data: ['冷氣', '冰箱','燈光', '電動車充電樁', '總負載']},

                yAxis: {type: 'value', max: 120},

                series: [{

                    data: [acPower, fridgePower, lightPower, evPower,currentLoad],

                    type: 'bar',

                    itemStyle: {

                        color: function(params){

                            if (params.dataIndex === 4){

                                return currentLoad > 80 ? '#ff4d4d' : '#ff9900';

                            }

                            return '#00ff99';

                        }

                    }

                }]

            };

            myChart.setOption(option);

        }

        function queryHistory() {

            const selectedDate = document.getElementById('history-date-picker').value;

            if (!selectedDate) {

                alert("請選擇日期");

                return;

            }

            /* 1. 模擬「資料庫」中的資料 ， 現實狀況會以一組API傳回來*/

            let rawData = [

                { name: '冷氣', value: Math.floor(Math.random() * 500) + 100 },

                { name: '冰箱', value: 240 },

                { name: '燈光', value: Math.floor(Math.random() * 100) + 20 },

                { name: '電動車', value: Math.floor(Math.random() * 600) },

                { name: '熱水器', value: Math.floor(Math.random() * 400) }

            ];

            /*2. 【由大到小排序】*/

            rawData.sort((a, b) => b.value - a.value);

            const sortedNames = rawData.map(item => item.name);

            const sortedValues = rawData.map(item => item.value);



            document.getElementById('history-title').innerText = `${selectedDate} 設備耗電排名 (KWH)`;



            const option = {

                backgroundColor: 'transparent',

                tooltip: { trigger: 'axis' },

                xAxis: { type: 'category', data: sortedNames },

                yAxis: { type: 'value', name: '度數 (kWh)' },

                series: [{

                    data: sortedValues,

                    type: 'bar',

                    color: '#00ff99',

                    showBackground: true,

                    backgroundStyle: { color: 'rgba(180, 180, 180, 0.1)' }

                }]

            };

            historyChart.setOption(option);

        }



        setInterval(updateData, 60000);



        updateData();



       

    </script>

</body>

</html>
