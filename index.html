<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>智慧電力調度系統</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

    <style>
        body {background-color: #1a1a1a; color:white; font-family: sans-serif; padding:20px; }
        .dsahboard {display:  flex; gap: 20px; flex-wrap: wrap; }
        .card {background: #2d2d2d; padding: 20px; border-radius: 10px; flex: 1; min-width: 300px; }
        h1 { color: #00ff99; }
        .status { font-size: 24px; font-weight: bold; margin: 10px 0; }
        #chart {width: 100%; height: 400px; }
    </style>
</head>
<body>
    <h1>⚡ 智慧電力調度系統 (Prototype)</h1>

    <div class="dsahboard">
        <div class="card">
            <h3>目前即時總負載</h3>
            <div id="load-value" class="status" style="color: #00ff99;">0 %</div>
            <p>狀態 : 系統穩定進行中</p>
        </div>

        <div class="card">
            <h3>全城市區域電力分配</h3>
            <div id="chart"></div>
        </div>
    </div>

    <script>
        const chartDom=document.getElementById('chart');
        const myChart=echart.init(chartDom,'dark');

        function updateData(){
            const currentLoad=Math.floor(Math.random()*50)+40;
            document.getElementById('load-value').innerText=`${currentLoad}%`;

            document.getElementById('load-value').style.color = currentLoad > 80 ? '#ff4d4d' : '#00ff99';

            const option={
                backgroundColor: 'transparent',
                xAxis: {type: 'category', data: ['北區','中區','南區','東區','離島']},
                yAxis: {type: 'value', max: 100},
                series: [{
                    data: [
                        currentLoad,
                        Math.random()*80,
                        Math.random()*70,
                        Math.random()*60,
                        Math.random()*50
                    ],
                    type: 'bar',
                    color: '#00ff99'
                }]
            };
            myChart.setOption(option);
        }

        setInterval(updateData, 2000);

        updateData();

        //TEST
    </script>
</body>
</html>
