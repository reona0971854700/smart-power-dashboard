<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>智慧電力調度系統</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

    <style>
        body {background-color: #1a1a1a; color:white; font-family: sans-serif; padding:20px; }
        .dsahboard {display:  flex; gap: 20px; flex-wrap: wrap; }
        .card {background: #333131; padding: 20px; border-radius: 10px; flex: 1; min-width: 300px; }
        h1 { color: #00ff99; }
        .status { font-size: 100px; font-weight: bold; margin: 10px 0; }
        #chart {width: 100%; height: 400px; }
        .navbar {
            background-color: #000000;          /*背景*/
            border-bottom: 2px solid #00ff99;   /*底部邊框線*/
            /*display: flex;                        /*使用彈性布局*/
            position: fixed;                      /* 固定在最上方，捲動時不會消失 */
            width: 100%;
            top: 0;
            left: 0;
            z-index: 1000;                        /* 確保導覽列在最上層 */
            /*justify-content: space-between;       /*讓LOGO在左，連結在右*/
            align-items: center;                  /*垂直居中*/
            /*padding: 1px 50px;                   /*內邊距*/
            /*border-bottom: 2px solid #00ff99;   /*底線*/
            /*margin-bottom: 30px;                  /*與下方標題保持距離*/
        }
        /* 2. 導覽列內部限制器：負責內容置中 */
        .nav-container {
            max-width: 1200px;                       /* 設定導覽列內容的最大寬度 */
            margin: 0 auto;                          /* 「水平置中」的神奇咒語 */
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;          /* Logo 在左，連結在右 */
            align-items: center;
        }
        .logo {
            color: #00ff99;
            font-weight: 1.5rem;
            font-weight: bold;
        }
        .nav-links {
            list-style-type: none;
            display: flex;
            gap: 100px;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 1rem;
            transition: 0.3;            /*動畫過渡時間*/
        }
        /*滑鼠對導覽列的互動效果*/
        .nav-links a:hover {
            color: #00ff99;
        }
        body {
            padding: 80px;
            background: #1a1a1a;
            color: white;
            font-family: sans-serif;
        }
</style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">⚡ SmartPower-Dashboard</div>
            <ul class="nav-links">
                <li><a href="#">儀錶板</a></li>
                <li><a href="#">歷史數據</a></li>
                <li><a href="#">設備管理</a></li>
                <li><a href="#">系統設定</a></li>
            </ul>
        </div>
    </nav>
    <h1>🏠 智慧建築能源管理系統</h1>

    <div class="dsahboard">
        <div class="card">
            <h3>目前即時總負載</h3>
            <div id="load-value" class="status" style="color: #00ff99;">0 %</div>
            <p>狀態 : 系統穩定進行中</p>
        </div>

        <div class="card">
            <h3>各項設備即時功耗</h3>
            <div id="chart"></div>
        </div>
    </div>

    <script>
        const chartDom=document.getElementById('chart');
        const myChart=echarts.init(chartDom,'dark');

        function updateData(){
            const acPower = Math.floor(Math.random() * 40) + 10;     // 冷氣
            const fridgePower = 15;                                  // 冰箱：固定 15% 
            const lightPower = Math.floor(Math.random() * 10) + 2;   // 燈光
            const evPower = Math.floor(Math.random() * 30);          // 電動車充電
            const currentLoad = acPower + fridgePower + lightPower + evPower;
            document.getElementById('load-value').innerText=`${currentLoad}%`;

            document.getElementById('load-value').style.color = currentLoad > 80 ? '#ff4d4d' : '#00ff99';

            const option={
                backgroundColor: 'transparent',
                xAxis: {type: 'category', data: ['冷氣', '冰箱','燈光', '電動車充電樁', '總負載']},
                yAxis: {type: 'value', max: 120},
                series: [{
                    data: [acPower, fridgePower, lightPower, evPower,currentLoad],
                    type: 'bar',
                    itemStyle: {
                        color: function(params){
                            if (params.dataIndex === 4){
                                return currentLoad > 80 ? '#ff4d4d' : '#ff9900';
                            }
                            return '#00ff99';
                        }
                    }
                }]
            };
            myChart.setOption(option);
        }

        setInterval(updateData, 5000);

        updateData();

        
    </script>
</body>
</html>
