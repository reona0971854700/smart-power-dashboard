<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>智慧電力調度系統</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

    <style>
        body {background-color: #1a1a1a; color:white; font-family: sans-serif; padding:20px; }
        .dsahboard {display:  flex; gap: 20px; flex-wrap: wrap; }
        .card {background: #333131; padding: 20px; border-radius: 10px; flex: 1; min-width: 300px; }
        h1 { color: #00ff99; }
        .status { font-size: 100px; font-weight: bold; margin: 10px 0; }
        #chart {width: 100%; height: 400px; }
    </style>
</head>
<body>
    <h1>🏠 智慧建築能源管理系統</h1>

    <div class="dsahboard">
        <div class="card">
            <h3>目前即時總負載</h3>
            <div id="load-value" class="status" style="color: #00ff99;">0 %</div>
            <p>狀態 : 系統穩定進行中</p>
        </div>

        <div class="card">
            <h3>各項設備即時功耗</h3>
            <div id="chart"></div>
        </div>
    </div>

    <script>
        const chartDom=document.getElementById('chart');
        const myChart=echarts.init(chartDom,'dark');

        function updateData(){
            const acPower = Math.floor(Math.random() * 40) + 10;     // 冷氣
            const fridgePower = 15;                                  // 冰箱：固定 15% 
            const lightPower = Math.floor(Math.random() * 10) + 2;   // 燈光
            const evPower = Math.floor(Math.random() * 30);          // 電動車充電
            const currentLoad = acPower + fridgePower + lightPower + evPower;
            document.getElementById('load-value').innerText=`${currentLoad}%`;

            document.getElementById('load-value').style.color = currentLoad > 80 ? '#ff4d4d' : '#00ff99';

            const option={
                backgroundColor: 'transparent',
                xAxis: {type: 'category', data: ['冷氣', '冰箱','燈光', '電動車充電樁', '總負載']},
                yAxis: {type: 'value', max: 120},
                series: [{
                    data: [acPower, fridgePower, lightPower, evPower,currentLoad],
                    type: 'bar',
                    itemStyle: {
                        color: function(params){
                            if (params.dataIndex === 4){
                                return currentLoad > 80 ? '#ff4d4d' : '#ff9900';
                            }
                            return '#00ff99';
                        }
                    }
                }]
            };
            myChart.setOption(option);
        }

        setInterval(updateData, 5000);

        updateData();

        
    </script>
</body>
</html>
